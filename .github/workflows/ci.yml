name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx tsx --test test/*.test.ts

  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: engine   # brain imports engine sources
      - run: npm install
        working-directory: brain
      - run: npx tsc --noEmit
        working-directory: brain
      - run: npx tsx --test test/*.test.ts
        working-directory: brain

  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: engine   # orchestrator imports engine sources
      - run: npm install
        working-directory: apps/orchestrator
      - run: npx tsc --noEmit
        working-directory: apps/orchestrator
      - run: npx tsx --test test/*.test.ts
        working-directory: apps/orchestrator

  pwa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/pwa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate schemas parse and are draft 2020-12
        run: |
          python3 - << 'PY'
          import json, glob, sys
          for f in sorted(glob.glob('schemas/*.json')):
              s = json.load(open(f))
              assert '2020-12' in s.get('$schema',''), f
              print('OK', f)
          PY

  pack-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no pack content in version control, no direct pack imports
        run: |
          test -z "$(git ls-files packs | grep -v packs/README.md)" || { echo 'pack content committed!'; exit 1; }
          ! grep -rn "packs/hotdq" engine/src brain/src --include='*.ts' || { echo 'direct pack import in engine/brain'; exit 1; }
